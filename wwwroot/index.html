<!DOCTYPE html>
<html lang="kk" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Sapar AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#10262d;--muted:#586f75;--sea:#0b4f5c;--sea-d:#06323b;--foam:#eaf3f2;--line:#d3e3e1;--gold:#f2a900;--danger:#b3261e;--r:14px}
*{box-sizing:border-box}
html{font-family:Rubik,system-ui,sans-serif;color:var(--ink);background:var(--foam);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
.top{background:var(--sea-d);color:#fff;position:relative;overflow:hidden;padding-bottom:110px}
.top::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% 8%,rgba(242,169,0,.30),transparent 42%),radial-gradient(circle at 8% 95%,rgba(22,128,143,.5),transparent 48%)}
.top .wrap{position:relative}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.brand i{width:14px;height:14px;background:var(--gold);border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:inline-block}
.langs{display:flex;gap:4px;background:rgba(255,255,255,.12);padding:4px;border-radius:99px}
.langs button{border:0;background:transparent;color:#fff;font:inherit;font-weight:600;font-size:.85rem;padding:7px 14px;border-radius:99px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--gold);color:#2a1d00}
h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.08;font-weight:800;margin:34px 0 14px;max-width:18ch}
.top p{max-width:48ch;color:#c3dad9;font-size:1.05rem;line-height:1.55;margin:0}
main{margin-top:-80px;padding-bottom:40px;position:relative}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:0 14px 34px rgba(6,50,59,.13)}
form{display:grid;grid-template-columns:5fr 4fr 3fr;gap:16px}
.full{grid-column:1/-1}
label{display:block;font-weight:500;font-size:.9rem;margin-bottom:6px}
input,select{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.brow{display:flex;gap:8px}
.brow input{flex:1;min-width:0}
.brow select{flex:0 0 auto;width:auto;padding:12px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:#f4faf9;color:var(--ink);font:inherit;font-size:.85rem;padding:6px 12px;border-radius:99px;cursor:pointer}
.chip:hover{border-color:var(--gold);background:#fff8e6}
.step{display:flex;gap:6px}
.step button{flex:0 0 44px;border:1.5px solid var(--line);background:#f4faf9;border-radius:10px;font-size:1.2rem;cursor:pointer;color:var(--ink)}
.step input{text-align:center}
.go{font:inherit;font-weight:700;font-size:1rem;border:0;border-radius:10px;padding:14px 26px;background:var(--gold);color:#2a1d00;cursor:pointer}
.go:hover{filter:brightness(.95)}
.go:disabled{opacity:.6;cursor:wait}
.err{color:var(--danger);font-weight:500;margin-top:14px;min-height:1em}

.mapcard{margin-top:20px}
.maphead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.maphead h2{margin:0;font-size:1.2rem}
.mapsel{font-weight:600;color:var(--sea)}
.maphint{color:var(--muted);margin:6px 0 12px;font-size:.92rem;line-height:1.5}
#map{height:430px;border-radius:12px;border:1px solid var(--line);isolation:isolate;background:#cfe6ee}
#lmBox{margin-top:16px}
#lmBox[hidden]{display:none}
#lmBox h3{margin:0 0 10px;font-size:1rem}
.lmrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.lm{flex:0 0 156px;scroll-snap-align:start}
.lmb{display:block;width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:0;cursor:pointer;text-align:left;overflow:hidden;font:inherit;color:var(--ink)}
.lmb:hover{border-color:var(--gold)}
.lmb img,.lmb .ph{width:100%;height:104px;object-fit:cover;display:block;background:#dfeceb}
.lmb .ph{display:flex;align-items:center;justify-content:center;font-size:1.7rem}
.lmb span{display:block;padding:8px 10px;font-size:.85rem;font-weight:500;line-height:1.3;min-height:3.2em}
.wl{display:inline-block;margin-top:4px;font-size:.75rem;color:var(--sea);text-decoration:none}
.wl:hover{text-decoration:underline}
.credit{color:var(--muted);font-size:.78rem;margin:12px 0 0}
.pmw{background:transparent;border:0}
.pm{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.4);background:#dfeceb;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pm img{width:100%;height:100%;object-fit:cover;display:block}
.cpw{background:transparent;border:0}
.cp{width:18px;height:18px;border-radius:50%;background:var(--gold);border:3px solid #fff;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,169,0,.7)}70%{box-shadow:0 0 0 18px rgba(242,169,0,0)}100%{box-shadow:0 0 0 0 rgba(242,169,0,0)}}
.cityTip{font-weight:700;color:var(--sea-d)}

#result{margin-top:28px}
.meter{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:20px}
.mrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600}
.bar{height:12px;background:var(--foam);border-radius:99px;margin:12px 0;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--sea);border-radius:99px;transition:width .6s}
.bar b.over{background:var(--danger)}
.sum{color:var(--muted);line-height:1.55;margin:0}
.actions{display:flex;justify-content:flex-end;margin-bottom:12px}
.ghost{font:inherit;font-size:.9rem;font-weight:500;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;color:var(--ink)}
.day{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.dn{background:var(--sea);color:#fff;font-weight:700;border-radius:99px;padding:5px 12px;font-size:.85rem;white-space:nowrap}
.dh h2{margin:0;font-size:1.15rem}
.item{display:grid;grid-template-columns:58px 1fr auto;gap:14px;padding:13px 0;border-top:1px solid var(--line);align-items:start}
.time{font-weight:700;color:var(--sea)}
.item h3{margin:0 0 4px;font-size:1rem}
.item p{margin:0;color:var(--muted);line-height:1.5;font-size:.95rem}
.map{display:inline-block;margin-top:6px;font-size:.82rem;color:var(--sea);text-decoration:none;font-weight:500}
.map:hover{text-decoration:underline}
.cost{font-weight:700;white-space:nowrap;background:#eef6f5;border-radius:99px;padding:4px 12px;font-size:.9rem}
.cost.free{background:#fff4d6;color:#7a5200}
.tips{background:var(--sea);color:#fff;border-radius:var(--r);padding:20px 24px}
.tips h2{margin:0 0 10px;font-size:1.1rem}
.tips li{margin:6px 0;line-height:1.5}
.skel{height:90px;border-radius:var(--r);background:linear-gradient(90deg,#dbe8e6 25%,#eef5f4 50%,#dbe8e6 75%);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:14px}
@keyframes sk{to{background-position:-200% 0}}
.foot{text-align:center;color:var(--muted);font-size:.85rem;padding:0 18px 36px;margin:0}
@media(max-width:720px){form{grid-template-columns:1fr}.item{grid-template-columns:52px 1fr}.cost{grid-column:2;justify-self:start}#map{height:320px}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}.bar b{transition:none}.cp{animation:none}}
@media print{.top,.formcard,.mapcard,.actions,.foot{display:none}main{margin-top:0}body,html{background:#fff}.card,.day,.meter{box-shadow:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <nav>
    <div class="brand"><i></i>Sapar AI</div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="kk">ҚАЗ</button>
      <button type="button" data-lang="ru">РУС</button>
      <button type="button" data-lang="en">ENG</button>
    </div>
  </nav>
  <h1 data-i="h1"></h1>
  <p data-i="sub"></p>
</div></header>

<main class="wrap">
  <section class="card formcard">
    <form id="f" novalidate>
      <div>
        <label for="city" data-i="city"></label>
        <input id="city" list="cities" autocomplete="off" data-ph="cityPh">
        <datalist id="cities"></datalist>
        <div class="chips" id="cityChips"></div>
      </div>
      <div>
        <label for="budget" data-i="budget"></label>
        <div class="brow">
          <input id="budget" type="number" inputmode="numeric" min="1" step="any" value="200000">
          <select id="cur" aria-label="Currency">
            <option value="KZT">₸ KZT</option>
            <option value="USD">$ USD</option>
            <option value="EUR">€ EUR</option>
          </select>
        </div>
        <div class="chips" id="budgetChips"></div>
      </div>
      <div>
        <label for="days" data-i="days"></label>
        <div class="step">
          <button type="button" id="dm" aria-label="-">−</button>
          <input id="days" type="number" inputmode="numeric" min="1" max="14" value="2">
          <button type="button" id="dp" aria-label="+">+</button>
        </div>
      </div>
      <div class="full">
        <label for="interests" data-i="interests"></label>
        <input id="interests" data-ph="interestsPh">
        <div class="chips" id="intChips"></div>
      </div>
      <div class="full"><button class="go" id="go" type="submit" data-i="go"></button></div>
    </form>
    <div class="err" id="err" role="alert"></div>
  </section>

  <section class="card mapcard">
    <div class="maphead"><h2 data-i="mapTitle"></h2><span id="mapSel" class="mapsel"></span></div>
    <p class="maphint" data-i="mapHint"></p>
    <div id="map" role="region" aria-label="Map"></div>
    <div id="lmBox" hidden>
      <h3 data-i="lm"></h3>
      <div class="lmrow" id="lmRow"></div>
    </div>
    <p class="credit" data-i="credit"></p>
  </section>

  <section id="result" aria-live="polite"></section>
</main>
<p class="foot" data-i="foot"></p>

  en:{

    go:"Create itinerary", loading:"Building… 10–30 seconds",
    est:"Estimated cost", bud:"Budget", free:"Free", tips:"Money-saving tips",
    print:"Print / PDF", map:"Map",
    dayN:n=>"Day "+n,
    chips:["history","nature","local food","shopping","with family"],
    eCity:"Please enter a city.", eBudget:m=>"Budget must be at least "+m+".", eDays:"Days must be between 1 and 14.",
    eServer:"Could not build the plan. Please wait a bit and try again.", eBusy:"Too many requests. Please wait a bit and try again.",
    eTime:"The answer is taking too long. Please try again.", eNet:"Could not reach the server. Check your internet and try again.",
    mapTitle:"Map", mapHint:"Pick a city on the map or type it above. The country and city are highlighted and landmark photos appear.",

};

let lang = "kk", t = L_.kk, last = null, cur = "KZT", budgetTouched = false;
try { const s = localStorage.getItem("sapar-lang"); if (s && L_[s]) lang = s; } catch(e) {}

const fmt = (n, k) => {
  k = k || cur;
  const s = new Intl.NumberFormat(lang === "en" ? "en-US" : "ru-RU").format(Math.round(n));
  return k === "KZT" ? s + " ₸" : CUR[k].sym + s;
};
const cityName = c => c[{kk:0, ru:1, en:2}[lang]];
const countryLabel = n => { const x = COUNTRY[n]; return x ? (lang === "kk" ? x[0] : lang === "ru" ? x[1] : n) : n; };

function chip(text, fn){ const b = el("button","chip",text); b.type = "button"; b.addEventListener("click", fn); return b; }
function addInterest(txt){
  const f = $("interests"), parts = f.value.trim() ? f.value.trim().split(/\s*,\s*/) : [];
  if (!parts.includes(txt)) parts.push(txt);
  f.value = parts.join(", ");
}

function buildBudgetChips(){
  const bb = $("budgetChips"); bb.replaceChildren();
  CUR[cur].chips.forEach(v => bb.append(chip(fmt(v, cur), () => { $("budget").value = v; budgetTouched = true; })));
}
function setCur(k){
  cur = k; $("cur").value = k;
  if (!budgetTouched) $("budget").value = CUR[k].def;
  buildBudgetChips();
}
function autoCurrency(){
  const v = $("city").value.trim().toLowerCase();
  if (!KNOWN.has(v)) return;
  setCur(KZ.has(v) ? "KZT" : "USD");
}

function buildLists(){
  const dl = $("cities"); dl.replaceChildren();
  CITIES.forEach(c => { const o = document.createElement("option"); o.value = cityName(c); dl.append(o); });
  const cb = $("cityChips"); cb.replaceChildren();
  CITIES.filter(c => c[3]).forEach(c => cb.append(chip(cityName(c), () => pickCity(c[2]))));
  buildBudgetChips();
  const ib = $("intChips"); ib.replaceChildren();
  t.chips.forEach(x => ib.append(chip(x, () => addInterest(x))));
}

function setLang(l){
  lang = l; t = L_[l];
  try { localStorage.setItem("sapar-lang", l); } catch(e) {}
  document.documentElement.lang = l;
  document.title = "Sapar AI — " + t.h1;
  document.querySelectorAll("[data-i]").forEach(e => { e.textContent = t[e.dataset.i]; });
  document.querySelectorAll("[data-ph]").forEach(e => { e.placeholder = t[e.dataset.ph]; });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  buildLists();
  mapLang();
  if (last) render(last);
}

/* ================= КАРТА ================= */
let map = null, layer = null, ctry = null, dots = null, world = null;
let token = 0, curEn = null, curCustom = null, cityTimer = null;
const lmCache = {};

function initMap(){
  if (typeof L === "undefined"){ document.querySelector(".mapcard").hidden = true; return; }
  map = L.map("map", { minZoom:2, worldCopyJump:true, scrollWheelZoom:false, dragging:!L.Browser.mobile, tap:false }).setView([32, 52], 3);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:18, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
  }).addTo(map);
  dots = L.layerGroup().addTo(map);
  layer = L.layerGroup().addTo(map);
  map.on("focus", () => map.scrollWheelZoom.enable());
  map.on("blur", () => map.scrollWheelZoom.disable());
  setTimeout(() => map.invalidateSize(), 300);
  loadWorld();
}

async function loadWorld(){
  try {
    if (typeof topojson === "undefined") return;
    const r = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
    const topo = await r.json();
    world = topojson.feature(topo, topo.objects.countries).features;
    if (curEn || curCustom) mapLang();
  } catch(e) {}
}

function inRing(pt, ring){
  let c = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++){
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if (((yi > pt[1]) !== (yj > pt[1])) && (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi)) c = !c;
  }
  return c;
}
function inPoly(pt, poly){
  if (!inRing(pt, poly[0])) return false;
  for (let k = 1; k < poly.length; k++) if (inRing(pt, poly[k])) return false;
  return true;
}
function countryAt(lat, lng){
  const pt = [lng, lat];
  for (const f of world || []){
    const g = f.geometry; if (!g) continue;
    const polys = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
    for (const p of polys) if (inPoly(pt, p)) return f;
  }
  return null;
}
function findCountry(lat, lng){
  if (!world) return null;
  let f = countryAt(lat, lng);
  if (f) return f;
  const d = 0.25;
  for (const [a, b] of [[d,0],[-d,0],[0,d],[0,-d],[d,d],[-d,-d],[d,-d],[-d,d]]){
    f = countryAt(lat + a, lng + b);
    if (f) return f;
  }
  return null;
}

function buildDots(){
  if (!map) return;
  dots.clearLayers();
  CITIES.forEach(c => {
    const g = GEO[c[2]]; if (!g) return;
    const m = L.circleMarker([g[0], g[1]], { radius:5, color:"#fff", weight:1.5, fillColor:"#0b4f5c", fillOpacity:.95 });
    m.bindTooltip(cityName(c), { direction:"top" });
    m.on("click", () => pickCity(c[2]));
    dots.addLayer(m);
  });
}

async function wiki(params){
  const r = await fetch("https://en.wikipedia.org/w/api.php?format=json&origin=*&" + params);
  if (!r.ok) throw new Error("wiki");
  return r.json();
}
function toSpot(p){
  const c = p.coordinates && p.coordinates[0];
  const l = p.langlinks && p.langlinks[0];
  return {
    en: p.title,
    name: l ? (l.title || l["*"] || p.title) : p.title,
    lat: c ? c.lat : null, lng: c ? c.lon : null,
    img: p.thumbnail ? p.thumbnail.source : "",
    url: "https://en.wikipedia.org/wiki/" + encodeURIComponent(p.title.replace(/ /g, "_"))
  };
}
async function getSpots(titles, lat, lng){
  const key = lang + "|" + lat + "," + lng + "|" + titles.join("|");
  if (lmCache[key]) return lmCache[key];
  const prop = "&prop=pageimages|coordinates" + (lang !== "en" ? "|langlinks" : "");
  const extra = "&piprop=thumbnail&pithumbsize=360&pilimit=50&colimit=50" + (lang !== "en" ? "&lllang=" + lang + "&lllimit=50" : "");
  const spots = [], seen = new Set();
  const near = s => s.lat == null || map.distance([lat, lng], [s.lat, s.lng]) < 250000;
  if (titles.length){
    try {
      const d = await wiki("action=query&redirects=1&titles=" + encodeURIComponent(titles.join("|")) + prop + extra);
      const q = d.query || {}, norm = {}, red = {}, by = {};
      (q.normalized || []).forEach(n => { norm[n.from] = n.to; });
      (q.redirects || []).forEach(r => { red[r.from] = r.to; });
      Object.values(q.pages || {}).forEach(p => { by[p.title] = p; });
      titles.forEach(t0 => {
        let t1 = norm[t0] || t0; t1 = red[t1] || t1;
        const p = by[t1];
        if (!p || "missing" in p) return;
        const s = toSpot(p);
        if (!near(s) || seen.has(s.en)) return;
        seen.add(s.en); spots.push(s);
      });
    } catch(e) {}
  }
  if (spots.length < 3){
    try {
      const d = await wiki("action=query&generator=geosearch&ggscoord=" + encodeURIComponent(lat + "|" + lng) + "&ggsradius=10000&ggslimit=30" + prop + extra);
      const pages = Object.values((d.query || {}).pages || {}).sort((a, b) => (a.index || 0) - (b.index || 0));
      for (const p of pages){
        if (spots.length >= 5) break;
        const s = toSpot(p);
        if (!s.img || s.lat == null || seen.has(s.en) || !near(s)) continue;
        seen.add(s.en); spots.push(s);
      }
    } catch(e) {}
  }
  const out = spots.slice(0, 5);
  if (out.length) lmCache[key] = out;
  return out;
}

function renderSpots(spots, lat, lng){
  const row = $("lmRow"); row.replaceChildren();
  const pts = [[lat, lng]];
  spots.forEach(s => {
    let mk = null;
    if (s.lat != null){
      const wrap = el("div", "pm");
      if (s.img){ const im = document.createElement("img"); im.src = s.img; im.alt = s.name; wrap.append(im); } else wrap.textContent = "📍";
      mk = L.marker([s.lat, s.lng], { icon: L.divIcon({ className:"pmw", html:wrap, iconSize:[46,46], iconAnchor:[23,23] }) }).addTo(layer);
      mk.bindTooltip(s.name, { direction:"top", offset:[0,-24] });
      pts.push([s.lat, s.lng]);
    }
    const card = el("div", "lm");
    const b = el("button", "lmb"); b.type = "button";
    if (s.img){ const im = document.createElement("img"); im.src = s.img; im.alt = s.name; im.loading = "lazy"; b.append(im); }
    else b.append(el("div", "ph", "📍"));
    b.append(el("span", "", s.name));
    b.addEventListener("click", () => { if (mk){ map.flyTo([s.lat, s.lng], 15, { duration:1 }); mk.openTooltip(); } });
    const a = el("a", "wl", t.wl + " ↗");
    a.href = s.url; a.target = "_blank"; a.rel = "noopener";
    card.append(b, a);
    row.append(card);
  });
  $("lmBox").hidden = spots.length === 0;
  return pts;
}

async function showCity(en, custom, quiet){
  if (!map) return;
  const g = custom || GEO[en];
  if (!g) return;
  const my = ++token;
  const lat = g[0], lng = g[1], titles = g[3] || [];
  curEn = custom ? null : en;
  curCustom = custom || null;
  layer.clearLayers();
  if (ctry){ map.removeLayer(ctry); ctry = null; }

  const f = findCountry(lat, lng);
  const cname = g[2] || (f ? f.properties.name : "");
  const entry = custom ? null : CITIES.find(c => c[2] === en);
  const label = custom ? g[4] : cityName(entry);
  $("mapSel").textContent = "📍 " + label + (cname ? " · " + countryLabel(cname) : "");
  if (custom && !budgetTouched && cname) setCur(cname === "Kazakhstan" ? "KZT" : "USD");

  if (f) ctry = L.geoJSON(f, { style:{ color:"#f2a900", weight:2, fillColor:"#f2a900", fillOpacity:.22 }, interactive:false }).addTo(map);
  const pin = L.marker([lat, lng], {
    icon: L.divIcon({ className:"cpw", html: el("div", "cp"), iconSize:[18,18], iconAnchor:[9,9] }),
    interactive:false, keyboard:false
  }).addTo(layer);
  pin.bindTooltip(label, { permanent:true, direction:"right", offset:[12,0], className:"cityTip" });

  if (!quiet){
    if (ctry) map.flyToBounds(ctry.getBounds(), { padding:[20,20], maxZoom:6, duration:1.1 });
    else map.flyTo([lat, lng], 8, { duration:1.1 });
  }
  const t0 = Date.now();
  $("lmBox").hidden = true;
  const spots = await getSpots(titles, lat, lng);
  if (my !== token) return;
  const pts = renderSpots(spots, lat, lng);
  if (!quiet){
    await sleep(Math.max(0, 1400 - (Date.now() - t0)));
    if (my !== token) return;
    if (pts.length > 1) map.flyToBounds(L.latLngBounds(pts), { padding:[50,50], maxZoom:14, duration:1.4 });
    else map.flyTo([lat, lng], 11, { duration:1.2 });
  }
}

function pickCity(en){
  const c = CITIES.find(x => x[2] === en);
  if (!c) return;
  $("city").value = cityName(c);
  autoCurrency();
  showCity(en);
}

async function geocode(q){
  try {
    const r = await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=en&q=" + encodeURIComponent(q));
    const a = await r.json();
    return a.length ? { lat:+a[0].lat, lng:+a[0].lon } : null;
  } catch(e) { return null; }
}
async function cityChange(){
  if (!map) return;
  const v = $("city").value.trim();
  if (!v) return;
  const en = NAME2EN[v.toLowerCase()];
  if (en){ if (en !== curEn) showCity(en); return; }
  const g = await geocode(v);
  if (!g){ $("mapSel").textContent = t.notFound; return; }
  showCity(null, [g.lat, g.lng, "", [], v]);
}
function mapLang(){
  if (!map) return;
  buildDots();
  if (curEn) showCity(curEn, null, true);
  else if (curCustom) showCity(null, curCustom, true);
}

/* ================= МАРШРУТ ================= */
function cleanTitle(s){
  s = String(s || "");
  const re = /^\s*(?:\d+\s*[-–]?\s*(?:ші)?\s*(?:күн|день|day)|(?:день|day)\s*\d+)\s*[.:\-–]*\s*/i;
  for (let i = 0; i < 2; i++) s = s.replace(re, "");
  return s.trim();
}

function render(r){
  const { data, budget, city } = r, k = r.cur;
  const box = $("result"); box.replaceChildren();
  const days = Array.isArray(data.days) ? data.days : [];
  const total = days.reduce((s, d) => s + (d.items || []).reduce((a, i) => a + (+i.cost || 0), 0), 0);

  const act = el("div","actions");
  const pb = el("button","ghost",t.print); pb.type = "button"; pb.onclick = () => window.print();
  act.append(pb); box.append(act);

  const m = el("div","meter");
  const row = el("div","mrow");
  row.append(el("span","",t.est + ": " + fmt(total, k)), el("span","",t.bud + ": " + fmt(budget, k)));
  const bar = el("div","bar"), fill = document.createElement("b");
  if (total > budget) fill.className = "over";
  bar.append(fill);
  m.append(row, bar, el("p","sum",data.summary || ""));
  box.append(m);
  requestAnimationFrame(() => { fill.style.width = Math.min(100, total / budget * 100) + "%"; });

  days.forEach(d => {
    const day = el("div","day");
    const dh = el("div","dh");
    dh.append(el("span","dn",t.dayN(d.day)));
    const ttl = cleanTitle(d.title);
    if (ttl) dh.append(el("h2","",ttl));
    day.append(dh);
    (d.items || []).forEach(i => {
      const it = el("div","item");
      const mid = el("div");
      mid.append(el("h3","",i.place || ""), el("p","",i.description || ""));
      if (i.place){
        const a = el("a","map","📍 " + t.map);
        a.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(i.place + " " + city);
        a.target = "_blank"; a.rel = "noopener";
        mid.append(a);
      }
      const c = +i.cost || 0;
      it.append(el("div","time",i.time || ""), mid, el("div","cost" + (c ? "" : " free"), c ? fmt(c, k) : t.free));
      day.append(it);
    });
    box.append(day);
  });

  if (Array.isArray(data.tips) && data.tips.length){
    const tb = el("div","tips"); tb.append(el("h2","",t.tips));
    const ul = document.createElement("ul");
    data.tips.forEach(x => ul.append(el("li","",x)));
    tb.append(ul); box.append(tb);
  }
}

$("dm").onclick = () => { $("days").value = Math.max(1, (+$("days").value || 2) - 1); };
$("dp").onclick = () => { $("days").value = Math.min(14, (+$("days").value || 2) + 1); };
$("budget").addEventListener("input", () => { budgetTouched = true; });
$("cur").addEventListener("change", e => { budgetTouched = false; setCur(e.target.value); });
$("city").addEventListener("input", () => {
  autoCurrency();
  clearTimeout(cityTimer);
  const en = NAME2EN[$("city").value.trim().toLowerCase()];
  if (en && en !== curEn) cityTimer = setTimeout(() => showCity(en), 350);
});
$("city").addEventListener("change", cityChange);
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

function userError(msg){ const e = new Error(msg); e.user = true; return e; }

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const er = $("err"); er.textContent = "";
  const city = $("city").value.trim(), budget = +$("budget").value, days = +$("days").value, k = cur;
  if (!city){ er.textContent = t.eCity; return; }
  if (!(budget >= CUR[k].min)){ er.textContent = t.eBudget(fmt(CUR[k].min, k)); return; }
  if (!(days >= 1 && days <= 14)){ er.textContent = t.eDays; return; }

  const btn = $("go"); btn.disabled = true; btn.textContent = t.loading;
  $("result").replaceChildren(el("div","skel"), el("div","skel"), el("div","skel"));
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 100000);
  try {
    const res = await fetch("/api/itinerary", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: ctrl.signal,
      body: JSON.stringify({ city, budget, days, interests: $("interests").value, lang, currency: k })
    });
    let data = null; try { data = await res.json(); } catch(x) {}
    if (!res.ok || !data || !Array.isArray(data.days)) throw userError(res.status === 429 ? t.eBusy : t.eServer);
    last = { data, budget, city, cur: k };
    render(last);
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch(ex) {
    $("result").replaceChildren();
    er.textContent = ex.name === "AbortError" ? t.eTime : (ex.user ? ex.message : t.eNet);
  } finally {
    clearTimeout(to); btn.disabled = false; btn.textContent = t.go;
  }
});

try { initMap(); } catch(e) { map = null; document.querySelector(".mapcard").hidden = true; }
setLang(lang);
</script>
